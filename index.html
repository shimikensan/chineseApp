<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Trung - Đào Vàng</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Header: User, Score, Target Word -->
        <header id="header">
            <div class="user-panel">
                <div id="user-info" class="hidden">
                    <i class="fas fa-user-circle"></i> <span id="user-name">Người chơi</span>
                    <button id="logout-btn" title="Đăng xuất"><i class="fas fa-sign-out-alt"></i></button>
                </div>
                <button id="leaderboard-btn"><i class="fas fa-trophy"></i> BXH</button>
            </div>
            
            <div class="score-board">
                Điểm: <span id="score">0</span>
            </div>
            
            <div class="target-word">
                <div id="target-meaning">Đang tải...</div>
                <div id="target-pinyin"></div>
            </div>
            
            <div class="timer-board">
                Thời gian: <span id="time">60</span>s
            </div>
        </header>

        <!-- Main Game Area -->
        <main id="play-area">
            <div id="claw-base">
                <div id="claw-arm">
                    <div id="rope"></div>
                    <div id="hook"></div>
                </div>
            </div>

            <div id="ground"></div>
            
            <div id="copyright">Diệu Ngọc @copyright</div>
        </main>
        
        <!-- Game Over / Start Screen -->
        <div id="overlay" class="hidden">
            <div class="modal glass-panel">
                <h1 id="modal-title" class="glow-text">ĐÀO VÀNG TIẾNG TRUNG</h1>
                <p id="modal-desc">Kéo các chữ Hán đúng với từ hiển thị phía trên để ghi điểm!</p>
                <button id="start-btn" class="btn-primary">Bắt Đầu Chơi</button>
            </div>
        </div>

        <!-- Auth Overlay -->
        <div id="auth-overlay">
            <div class="modal glass-panel">
                <h1 class="glow-text">ĐĂNG NHẬP</h1>
                <p>Đăng nhập để lưu điểm của bạn!</p>
                <div class="auth-form">
                    <input type="email" id="email-input" placeholder="Email" required>
                    <input type="password" id="password-input" placeholder="Mật khẩu" required>
                    <div class="auth-actions">
                        <button id="login-btn" class="btn-primary">Đăng Nhập</button>
                        <button id="register-btn" class="btn-secondary">Đăng Ký</button>
                    </div>
                    <p id="auth-error" class="error-msg"></p>
                </div>
            </div>
        </div>

        <!-- Leaderboard Overlay -->
        <div id="leaderboard-overlay" class="hidden">
            <div class="modal glass-panel">
                <h1 class="glow-text"><i class="fas fa-trophy"></i> BẢNG XẾP HẠNG</h1>
                <ul id="leaderboard-list">
                    <!-- List items generated by JS -->
                </ul>
                <button id="close-leaderboard-btn" class="btn-secondary">Đóng</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
